<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library System — Login</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --border: #262b36;
    --text: #e8eaed; --muted: #8b93a3;
    --accent: #4f8cff; --accent-hover: #3d78e6; --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px;
  }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 36px 32px; width: 100%; max-width: 380px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 12px; margin-bottom: 18px; border-radius: 8px;
    border: 1px solid var(--border); background: #0f1115; color: var(--text); font-size: 15px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; padding: 12px; border-radius: 8px; border: none;
    background: var(--accent); color: white; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #msg { margin-top: 16px; font-size: 14px; text-align: center; min-height: 18px; }
  #msg.error { color: var(--error); }
  #msg.info { color: var(--muted); }
</style>
</head>
<body>

<div class="card">
  <h1>School Library System</h1>
  <p class="sub">Sign in with the login your administrator set up.</p>

  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="username">

    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="current-password">

    <button type="submit" id="loginBtn">Sign In</button>
  </form>

  <div id="msg"></div>
</div>

<script>
  // ---- Supabase config ----
  const SUPABASE_URL = "https://tsrqvipamjuilyppptuc.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzcnF2aXBhbWp1aWx5cHBwdHVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4OTQwOTgsImV4cCI6MjEwNTQ3MDA5OH0.TBPQX578wixxINvVqT2-TRqZEKZyeum2v9363_pp8n8";

  const form = document.getElementById("loginForm");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("loginBtn");

  // If already logged in with a valid session, skip straight to dashboard
  const existingToken = localStorage.getItem("sb_access_token");
  if (existingToken) {
    window.location.href = "dashboard.html";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "";
    msg.className = "";
    btn.disabled = true;
    btn.textContent = "Signing in...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const authRes = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, password })
      });

      const authData = await authRes.json();

      if (!authRes.ok || !authData.access_token) {
        msg.textContent = authData.error_description || authData.msg || "Invalid email or password.";
        msg.className = "error";
        btn.disabled = false;
        btn.textContent = "Sign In";
        return;
      }

      // Confirm this user has a profile (school assigned) before letting them in
      const profileRes = await fetch(
        `${SUPABASE_URL}/rest/v1/profiles?id=eq.${authData.user.id}&select=school_id,username`,
        {
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${authData.access_token}`
          }
        }
      );
      const profileData = await profileRes.json();

      if (!profileRes.ok || !profileData.length) {
        msg.textContent = "No school is linked to this account. Contact your administrator.";
        msg.className = "error";
        btn.disabled = false;
        btn.textContent = "Sign In";
        return;
      }

      // Store session
      localStorage.setItem("sb_access_token", authData.access_token);
      localStorage.setItem("sb_user_id", authData.user.id);

      window.location.href = "dashboard.html";

    } catch (err) {
      msg.textContent = "Network error — check your connection and try again.";
      msg.className = "error";
      btn.disabled = false;
      btn.textContent = "Sign In";
    }
  });
</script>

</body>
</html>
