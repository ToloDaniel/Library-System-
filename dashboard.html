<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Dashboard</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --border: #262b36;
    --text: #e8eaed; --muted: #8b93a3;
    --accent: #4f8cff; --accent-hover: #3d78e6;
    --error: #ff6b6b; --success: #4caf7d; --warn: #e0a63a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
  header h1 { font-size: 18px; margin: 0; }
  header .school-name { color: var(--muted); font-size: 13px; }
  button { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); }
  button.primary:hover { background: var(--accent-hover); }
  button.danger { color: var(--error); border-color: var(--error); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  main { max-width: 1000px; margin: 0 auto; padding: 20px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 18px; }
  .panel h2 { font-size: 15px; margin: 0 0 14px; color: var(--muted); font-weight: 600; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row input { flex: 1; min-width: 120px; padding: 9px 10px; border-radius: 7px; border: 1px solid var(--border); background: #0f1115; color: var(--text); font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  tbody tr:hover { background: #1c202a; }
  .table-wrap { overflow-x: auto; }
  .badge { padding: 3px 8px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .badge.yes { background: rgba(76,175,125,0.15); color: var(--success); }
  .badge.no { background: rgba(255,107,107,0.15); color: var(--error); }
  .fine { color: var(--warn); font-weight: 600; }
  .actions button { padding: 5px 10px; font-size: 12px; margin-right: 4px; }
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); padding: 12px 18px; border-radius: 8px;
    font-size: 14px; display: none; max-width: 90%; text-align: center;
  }
  #toast.success { border-color: var(--success); color: var(--success); }
  #toast.error { border-color: var(--error); color: var(--error); }
  .empty { color: var(--muted); text-align: center; padding: 20px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Library Dashboard</h1>
    <div class="school-name" id="schoolName">Loading school...</div>
  </div>
  <button id="logoutBtn">Log Out</button>
</header>

<main>

  <div class="panel">
    <h2>Search</h2>
    <div class="row">
      <input type="text" id="searchInput" placeholder="Search by book number or subject...">
      <button class="primary" id="searchBtn">Search</button>
      <button id="clearSearchBtn">Clear</button>
    </div>
  </div>

  <div class="panel">
    <h2>Add Book</h2>
    <div class="row">
      <input type="text" id="addBookNo" placeholder="Book number">
      <input type="text" id="addGrade" placeholder="Grade (e.g. 7)">
      <input type="text" id="addSubject" placeholder="Subject">
      <button class="primary" id="addBtn">Add</button>
    </div>
  </div>

  <div class="panel">
    <h2>Borrow a Book</h2>
    <div class="row">
      <input type="text" id="borrowBookNo" placeholder="Book number">
      <input type="text" id="borrowStudent" placeholder="Student name">
      <input type="text" id="borrowAdm" placeholder="Admission number">
      <button class="primary" id="borrowBtn">Borrow</button>
    </div>
  </div>

  <div class="panel">
    <h2>Books</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Book #</th><th>Grade</th><th>Subject</th><th>Status</th>
            <th>Student</th><th>Adm No</th><th>Days Held</th><th>Fine (KSh)</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="booksBody">
          <tr><td colspan="9" class="empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<div id="toast"></div>

<script>
  const SUPABASE_URL = "https://tsrqvipamjuilyppptuc.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzcnF2aXBhbWp1aWx5cHBwdHVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4OTQwOTgsImV4cCI6MjEwNTQ3MDA5OH0.TBPQX578wixxINvVqT2-TRqZEKZyeum2v9363_pp8n8";

  const accessToken = localStorage.getItem("sb_access_token");
  const userId = localStorage.getItem("sb_user_id");
  let schoolId = null;

  if (!accessToken || !userId) {
    window.location.href = "login.html";
  }

  function authHeaders(extra) {
    return Object.assign({
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${accessToken}`
    }, extra || {});
  }

  function toast(message, type) {
    const t = document.getElementById("toast");
    t.textContent = message;
    t.className = type;
    t.style.display = "block";
    setTimeout(() => { t.style.display = "none"; }, 3500);
  }

  async function handleAuthFailure(res) {
    if (res.status === 401) {
      localStorage.removeItem("sb_access_token");
      localStorage.removeItem("sb_user_id");
      window.location.href = "login.html";
      return true;
    }
    return false;
  }

  document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("sb_access_token");
    localStorage.removeItem("sb_user_id");
    window.location.href = "login.html";
  });

  // ---- Init: load profile + school ----
  async function init() {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/profiles?id=eq.${userId}&select=school_id,username,schools(name)`,
      { headers: authHeaders() }
    );
    if (await handleAuthFailure(res)) return;

    const rows = await res.json();
    if (!res.ok || !rows.length) {
      toast("Could not load your school profile.", "error");
      return;
    }

    const profile = rows[0];
    schoolId = profile.school_id;
    document.getElementById("schoolName").textContent =
      (profile.schools?.name || "Your school") + " — " + profile.username;

    loadBooks();
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function renderBooks(rows) {
    const body = document.getElementById("booksBody");
    if (!rows || rows.length === 0) {
      body.innerHTML = `<tr><td colspan="9" class="empty">No books found.</td></tr>`;
      return;
    }
    body.innerHTML = rows.map(r => `
      <tr>
        <td>${escapeHtml(r.book_number)}</td>
        <td>${r.grade}</td>
        <td>${escapeHtml(r.subject)}</td>
        <td><span class="badge ${r.availability === 'Yes' ? 'yes' : 'no'}">${r.availability === 'Yes' ? 'Available' : 'Borrowed'}</span></td>
        <td>${escapeHtml(r.student_name || 'N/A')}</td>
        <td>${escapeHtml(r.adm_no || 'N/A')}</td>
        <td>${r.days_held ?? 0}</td>
        <td>${r.fine_amount > 0 ? `<span class="fine">${r.fine_amount}</span>` : '0'}</td>
        <td class="actions">
          ${r.availability === 'No' ? `<button data-action="return" data-book="${escapeHtml(r.book_number)}">Return</button>` : ''}
          <button data-action="remove" data-book="${escapeHtml(r.book_number)}" class="danger">Remove</button>
        </td>
      </tr>
    `).join("");

    body.querySelectorAll("button[data-action]").forEach(btn => {
      btn.addEventListener("click", () => {
        const action = btn.dataset.action;
        const bookNo = btn.dataset.book;
        if (action === "return") returnBook(bookNo);
        if (action === "remove") removeBook(bookNo);
      });
    });
  }

  async function loadBooks() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/book_status?select=*&order=book_number.asc`, { headers: authHeaders() });
    if (await handleAuthFailure(res)) return;
    const data = await res.json();
    if (!res.ok) { toast("Failed to load books.", "error"); return; }
    renderBooks(data);
  }

  document.getElementById("searchBtn").addEventListener("click", async () => {
    const q = document.getElementById("searchInput").value.trim();
    if (!q) { loadBooks(); return; }
    const filter = `or=(book_number.ilike.*${encodeURIComponent(q)}*,subject.ilike.*${encodeURIComponent(q)}*)`;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/book_status?select=*&${filter}&order=book_number.asc`, { headers: authHeaders() });
    if (await handleAuthFailure(res)) return;
    const data = await res.json();
    if (!res.ok) { toast("Search failed.", "error"); return; }
    renderBooks(data);
  });

  document.getElementById("clearSearchBtn").addEventListener("click", () => {
    document.getElementById("searchInput").value = "";
    loadBooks();
  });

  document.getElementById("addBtn").addEventListener("click", async () => {
    const book_number = document.getElementById("addBookNo").value.trim();
    const grade = document.getElementById("addGrade").value.trim();
    const subject = document.getElementById("addSubject").value.trim();

    if (!book_number || !grade || !subject) {
      toast("Fill in book number, grade, and subject.", "error");
      return;
    }

    const res = await fetch(`${SUPABASE_URL}/rest/v1/books`, {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json", "Prefer": "return=minimal" }),
      body: JSON.stringify({ school_id: schoolId, book_number, grade: parseFloat(grade), subject, availability: "Yes" })
    });
    if (await handleAuthFailure(res)) return;

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      toast("Add failed: " + (err.message || "check for duplicate book number"), "error");
      return;
    }

    document.getElementById("addBookNo").value = "";
    document.getElementById("addGrade").value = "";
    document.getElementById("addSubject").value = "";
    toast("Book added.", "success");
    loadBooks();
  });

  document.getElementById("borrowBtn").addEventListener("click", async () => {
    const book_no = document.getElementById("borrowBookNo").value.trim();
    const student_name = document.getElementById("borrowStudent").value.trim();
    const adm_no = document.getElementById("borrowAdm").value.trim();

    if (!book_no || !student_name || !adm_no) {
      toast("Fill in book number, student name, and admission number.", "error");
      return;
    }

    const findRes = await fetch(
      `${SUPABASE_URL}/rest/v1/books?school_id=eq.${schoolId}&book_number=eq.${encodeURIComponent(book_no)}&select=availability`,
      { headers: authHeaders() }
    );
    if (await handleAuthFailure(findRes)) return;
    const findData = await findRes.json();

    if (!findRes.ok || !findData.length) { toast("Book not found.", "error"); return; }
    if (findData[0].availability !== "Yes") { toast("Book is already borrowed.", "error"); return; }

    const insertRes = await fetch(`${SUPABASE_URL}/rest/v1/borrowed_books`, {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json", "Prefer": "return=minimal" }),
      body: JSON.stringify({ school_id: schoolId, student_name, adm_no, book_no })
    });
    if (!insertRes.ok) { toast("Borrow failed.", "error"); return; }

    await fetch(`${SUPABASE_URL}/rest/v1/books?school_id=eq.${schoolId}&book_number=eq.${encodeURIComponent(book_no)}`, {
      method: "PATCH",
      headers: authHeaders({ "Content-Type": "application/json", "Prefer": "return=minimal" }),
      body: JSON.stringify({ availability: "No" })
    });

    document.getElementById("borrowBookNo").value = "";
    document.getElementById("borrowStudent").value = "";
    document.getElementById("borrowAdm").value = "";
    toast("Book issued successfully.", "success");
    loadBooks();
  });

  async function returnBook(book_no) {
    const findRes = await fetch(
      `${SUPABASE_URL}/rest/v1/borrowed_books?school_id=eq.${schoolId}&book_no=eq.${encodeURIComponent(book_no)}&select=created_date`,
      { headers: authHeaders() }
    );
    if (await handleAuthFailure(findRes)) return;
    const findData = await findRes.json();
    if (!findRes.ok || !findData.length) { toast("This book is not currently issued.", "error"); return; }

    const daysHeld = Math.floor((Date.now() - new Date(findData[0].created_date)) / (1000 * 60 * 60 * 24));

    await fetch(`${SUPABASE_URL}/rest/v1/borrowed_books?school_id=eq.${schoolId}&book_no=eq.${encodeURIComponent(book_no)}`, {
      method: "DELETE", headers: authHeaders()
    });
    await fetch(`${SUPABASE_URL}/rest/v1/books?school_id=eq.${schoolId}&book_number=eq.${encodeURIComponent(book_no)}`, {
      method: "PATCH",
      headers: authHeaders({ "Content-Type": "application/json", "Prefer": "return=minimal" }),
      body: JSON.stringify({ availability: "Yes" })
    });

    if (daysHeld > 5) {
      const fine = (daysHeld - 5) * 10;
      toast(`Returned. Fine due: KSh ${fine} (${daysHeld - 5} days late).`, "error");
    } else {
      toast("Returned on time — no fine.", "success");
    }
    loadBooks();
  }

  async function removeBook(book_no) {
    if (!confirm(`Remove book ${book_no}? This cannot be undone.`)) return;

    await fetch(`${SUPABASE_URL}/rest/v1/borrowed_books?school_id=eq.${schoolId}&book_no=eq.${encodeURIComponent(book_no)}`, {
      method: "DELETE", headers: authHeaders()
    });
    const res = await fetch(`${SUPABASE_URL}/rest/v1/books?school_id=eq.${schoolId}&book_number=eq.${encodeURIComponent(book_no)}`, {
      method: "DELETE", headers: authHeaders()
    });

    if (!res.ok) { toast("Remove failed.", "error"); return; }
    toast("Book removed.", "success");
    loadBooks();
  }

  init();
</script>

</body>
</html>
